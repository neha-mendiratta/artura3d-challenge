# Generated from apps/api/src/openapi.ts by `npm run spec`. Do not edit by hand.
openapi: 3.1.0
info:
  title: Artura3D Orders API
  version: 1.0.0
  description: |-
    Create custom orthotic orders, submit them, quote them and follow the manufacturing packet.

    Workflow: an order is `Draft` (editable) until submitted; a `Submitted` order is locked except its notes. Quoting a `Submitted` order creates the quote and a `Pending` manufacturing packet, which a background worker completes within seconds.

    Every error has the same shape: `{ "error": { "code", "message" } }`.
servers:
  - url: /
paths:
  /orders:
    get:
      summary: List orders, newest first
      tags:
        - Orders
      description: Pages of 20. Pass `nextCursor` from a page as `cursor` to get the next one.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - Draft
              - Submitted
        - name: cursor
          in: query
          description: "`nextCursor` from the previous page"
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      summary: Create an order (Draft)
      tags:
        - Orders
      requestBody:
        required: true
        description: The order
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: The created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Order id (UUID)
        schema:
          type: string
          format: uuid
    get:
      summary: Get an order with its quote
      tags:
        - Orders
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      summary: Edit a Draft order
      tags:
        - Orders
      description: Replaces every field. 409 if the order is not a Draft.
      requestBody:
        required: true
        description: The order
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        description: Order id (UUID)
        schema:
          type: string
          format: uuid
    patch:
      summary: Edit the notes (any status)
      tags:
        - Orders
      description: The only change allowed after submit.
      requestBody:
        required: true
        description: The notes
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotesInput"
      responses:
        "200":
          description: The updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        description: Order id (UUID)
        schema:
          type: string
          format: uuid
    post:
      summary: Submit a Draft order
      tags:
        - Orders
      description: Draft → Submitted. 409 if it is already submitted.
      responses:
        "200":
          description: The submitted order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/quote:
    parameters:
      - name: id
        in: path
        required: true
        description: Order id (UUID)
        schema:
          type: string
          format: uuid
    post:
      summary: Quote a Submitted order (idempotent)
      tags:
        - Quote and packet
      description: "The first call creates the quote and a Pending manufacturing packet (201). Later calls return the same quote (200). Price: $100 + $2 per mm of thickness + $0.50 per mm of width, +15% if expedited. 409 if the order is a Draft."
      responses:
        "200":
          description: The existing quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "201":
          description: The new quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /orders/{id}/packet:
    parameters:
      - name: id
        in: path
        required: true
        description: Order id (UUID)
        schema:
          type: string
          format: uuid
    get:
      summary: Get the manufacturing packet
      tags:
        - Quote and packet
      description: 404 until the order is quoted.
      responses:
        "200":
          description: The packet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturingPacket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    OrderInput:
      type: object
      properties:
        patientRef:
          type: string
          minLength: 1
          maxLength: 50
          description: The clinic's patient code, not the patient's name. Trimmed
        lengthMm:
          type: number
          minimum: 150
          maximum: 350
          description: Length in mm, at most 1 decimal place
        widthMm:
          type: number
          minimum: 50
          maximum: 150
          description: Width in mm, at most 1 decimal place
        thicknessMm:
          type: number
          minimum: 1
          maximum: 15
          description: Thickness in mm, at most 1 decimal place
        colour:
          description: "Hex colour #RRGGBB, saved uppercase"
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        expedite:
          default: false
          description: Adds 15% to the quote
          type: boolean
        notes:
          description: Free text; empty or whitespace-only is saved as null
          anyOf:
            - type: string
              maxLength: 1000
            - type: "null"
      required:
        - patientRef
        - lengthMm
        - widthMm
        - thicknessMm
        - colour
      additionalProperties: false
    NotesInput:
      type: object
      properties:
        notes:
          description: Free text; empty or whitespace-only is saved as null
          anyOf:
            - type: string
              maxLength: 1000
            - type: "null"
      additionalProperties: false
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientRef:
          type: string
        lengthMm:
          type: number
        widthMm:
          type: number
        thicknessMm:
          type: number
        colour:
          type: string
          examples:
            - "#3366FF"
        expedite:
          type: boolean
        notes:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - Draft
            - Submitted
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
        quote:
          anyOf:
            - $ref: "#/components/schemas/Quote"
            - type: "null"
          description: null until quoted
    Quote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        totalCents:
          type: integer
          description: Total in cents, e.g. 17509 = $175.09
        createdAt:
          type: string
          format: date-time
    ManufacturingPacket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - Pending
            - Completed
            - Failed
        payload:
          type:
            - object
            - "null"
          description: The order as submitted plus its quote; set when Completed
        error:
          type:
            - string
            - "null"
          description: A plain message, set when Failed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrdersPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        nextCursor:
          type:
            - string
            - "null"
          format: uuid
          description: null on the last page
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - CONFLICT
                - INTERNAL_ERROR
            message:
              type: string
  responses:
    BadRequest:
      description: "VALIDATION_ERROR: invalid id, query or body; the message names the field"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "NOT_FOUND: no such order (or no packet yet)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "CONFLICT: not allowed in the order status (e.g. editing a Submitted order)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "INTERNAL_ERROR: unexpected error; details are logged, never returned"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
