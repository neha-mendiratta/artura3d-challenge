# Ports are published on 127.0.0.1 only, so the databases and the API (patient data)
# cannot be reached from other machines on the network.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: artura
      POSTGRES_PASSWORD: artura
      POSTGRES_DB: artura
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artura -d artura"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Separate database for tests so they never touch dev data.
  # tmpfs: data lives in memory and is discarded when the container stops.
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: artura
      POSTGRES_PASSWORD: artura
      POSTGRES_DB: artura_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artura -d artura_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://artura:artura@db:5432/artura
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Passes stop signals to the API so it shuts down straight away.
    init: true

volumes:
  db-data:
